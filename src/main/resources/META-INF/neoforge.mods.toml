modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod.license}"
issueTrackerURL = "${mod.issue_url}"

[[mods]]
modId = "${mod.modid}"
version = "${mod.version}"
displayName = "Excavar"
displayURL = "${mod.source_url}"
updateJSONURL = "https://assets.melanx.de/updates/excavar.json"
authors = "MelanX"
description = """
A lightweight excavation mod for modern Minecraft versions
"""

[[dependencies.${ mod.modid }]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${mod.neoforge},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${ mod.modid }]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${mod.minecraft},)"
    ordering = "NONE"
    side = "BOTH"
